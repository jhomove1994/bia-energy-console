schema: spec-driven
context: |
  Project: prueba-tecnica (technical test: AI Energy Management).
  Greenfield repo. Inputs in docs/: brief PDF, events.csv, readings.csv.
  Stack: undetermined - to be decided in proposal/design.
  Artifact language: English.
strict_tdd: true
strict_tdd_note: >
  Enabled after slice 1 created backend/go.mod and the first Go tests.
  Runner: go test ./... -count=1 (cwd backend, summary output only).
projects:
  - {name: backend, path: backend, language: go, version: "1.23"}
testing:
  runner: go test ./... -count=1
  runner_cwd: backend
  layers: {unit: true, integration: true, e2e: false}
  coverage: false
  linter: go vet ./...
  type_checker: go build ./...
  formatter: gofmt -l .
rules:
  proposal: {}
  spec: {}
  design: {}
  tasks: {}
  apply: {}
  verify: {}
  archive: {}
